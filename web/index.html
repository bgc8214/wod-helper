<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>WOD Helper</title>
<style>
  :root {
    --bg: #0f1115; --card: #191c23; --card2: #21252e; --line: #2a2f3a;
    --tx: #e8eaed; --tx2: #a3a9b5; --tx3: #6f7684;
    --accent: #ff6a3d; --accent2: #ffd166; --hl: #26c281; --link: #5aa9ff;
    --r: 16px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f5f7; --card:#fff; --card2:#f0f2f5; --line:#e3e6ea;
            --tx:#1b1e24; --tx2:#5a616e; --tx3:#8b93a1; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body { margin:0; padding:0; max-width:100%; overflow-x:hidden; }
  body {
    background: var(--bg); color: var(--tx);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    line-height: 1.5; padding: env(safe-area-inset-top) 0 40px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  header { padding: 20px 0 8px; }
  h1.brand { font-size: 15px; font-weight: 700; letter-spacing: .3px;
    color: var(--tx3); margin: 0 0 10px; text-transform: uppercase; }
  .datebar { display:flex; align-items:baseline; gap:10px; }
  .datebar .d { font-size: 26px; font-weight: 800; }
  .datebar .box { font-size: 13px; color: var(--tx2); }

  .tabs { display:flex; gap:8px; margin: 16px 0 8px; }
  .tab {
    flex:1; padding: 11px 0; text-align:center; border-radius: 12px;
    background: var(--card); color: var(--tx2); font-weight:700; font-size:15px;
    border: 1px solid var(--line); cursor:pointer; user-select:none;
    transition: all .12s;
  }
  .tab.active { background: var(--accent); color:#fff; border-color: var(--accent); }

  .wod {
    background: var(--card); border:1px solid var(--line); border-radius: var(--r);
    margin: 12px 0; overflow: hidden;
  }
  .wod.hl { border-color: color-mix(in srgb, var(--hl) 55%, var(--line)); }
  .wod-head {
    display:flex; align-items:center; gap:8px; padding: 14px 16px; cursor:pointer;
    user-select:none;
  }
  .wod-head .cat { font-weight: 800; font-size: 16px; flex-shrink:0; }
  .wod.hl .wod-head .cat { color: var(--hl); }
  .wod-head .times { margin-left:auto; font-size:12px; color:var(--tx3);
    text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    min-width:0; }
  .chev { color: var(--tx3); font-size:13px; transition: transform .15s; }
  .wod.open .chev { transform: rotate(90deg); }

  .wod-body { display:none; padding: 0 16px 8px; }
  .wod.open .wod-body { display:block; }

  .section { padding: 12px 0; border-top: 1px solid var(--line); }
  .section:first-child { border-top: none; }
  .sec-title { display:flex; align-items:center; gap:7px; font-weight:800; font-size:14px; }
  .sec-title .emoji { font-size:15px; }
  .sec-meta { margin: 6px 0 2px; font-size:13px; color: var(--tx2); }
  .sec-meta .pill {
    display:inline-block; background: var(--card2); border:1px solid var(--line);
    border-radius: 999px; padding: 2px 9px; margin: 2px 5px 2px 0; font-size:12px;
    color: var(--tx); font-weight:600;
  }
  .scheme { font-variant-numeric: tabular-nums; font-weight:800; font-size:19px;
    letter-spacing:1px; margin: 6px 0; }

  .mv { border-top: 1px dashed var(--line); }
  .mv:first-of-type { border-top: none; }
  .mv-row { display:flex; align-items:center; gap:8px; padding: 9px 0; cursor:pointer; }
  .mv-row > div:first-child { flex:1; min-width:0; }
  .mv-row.static { cursor: default; }
  .mv-ko { font-weight:700; font-size:15px; }
  .mv-en { font-size:12px; color: var(--tx3); }
  .mv-reps { font-size:13px; color: var(--tx2); font-weight:700;
    white-space:nowrap; flex-shrink:0; }
  .mv-note { font-size:11px; color: var(--accent2); }
  .mv-detail { display:none; padding: 2px 0 12px 2px; }
  .mv.open .mv-detail { display:block; }
  .mv-detail .desc { font-size:13.5px; color: var(--tx2); margin-bottom:8px; }
  .mv-detail a.yt {
    display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700;
    color:#fff; background:#e0362c; padding:7px 12px; border-radius:9px; text-decoration:none;
  }
  .badge-todo { font-size:11px; color: var(--tx3); background:var(--card2);
    border-radius:6px; padding:1px 6px; margin-left:6px; }

  .empty { text-align:center; color: var(--tx2); padding: 48px 16px; }
  .empty .big { font-size:40px; margin-bottom:10px; }
  footer { text-align:center; color: var(--tx3); font-size:12px; margin-top: 20px; }
  .raw-toggle { color: var(--tx3); font-size:12px; cursor:pointer; user-select:none;
    display:inline-block; margin-top:8px; }
  pre.raw { display:none; white-space:pre-wrap; font-size:12px; color:var(--tx2);
    background:var(--card2); border-radius:10px; padding:10px; margin-top:6px; }
  pre.raw.open { display:block; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand">WOD Helper</h1>
    <div class="datebar">
      <span class="d" id="dateLabel">–</span>
      <span class="box" id="boxLabel"></span>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" data-day="today" id="tabToday">오늘</div>
    <div class="tab" data-day="tomorrow" id="tabTomorrow">내일</div>
  </div>

  <div id="content"></div>

  <footer id="footer"></footer>
</div>

<script src="../data/latest.js" onerror="window.__noData=true"></script>
<script>
(function () {
  const SEC_EMOJI = {
    'WARM UP':'🧘','WARMUP':'🧘','MOBILITY':'🧘','SKILL':'🎯',
    'STRENGTH':'🔥','STRENGTH & SKILL':'🔥','WEIGHTLIFTING':'🏋️','GYMNASTIC':'🤸',
    'METCON':'⏱','CONDITIONING':'⏱','WOD':'💪','ACCESSORY':'➕','FINISHER':'🏁',
    'CORE':'🧱','COOL DOWN':'🌙','COOLDOWN':'🌙','BUY IN':'🚪','CASH OUT':'🏁'
  };
  const WEEK = ['일','월','화','수','목','금','토'];
  const data = window.WOD_DATA || null;
  const content = document.getElementById('content');
  let curDay = 'today';

  function fmtDate(iso) {
    const [y,m,d] = iso.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    return `${m}/${d} (${WEEK[dt.getDay()]})`;
  }

  function ytLink(mv, key) {
    if (mv && mv.youtube) return mv.youtube;
    const qy = encodeURIComponent('crossfit ' + (key || '').toLowerCase());
    return `https://www.youtube.com/results?search_query=${qy}`;
  }

  function renderItem(it) {
    const mv = it.movement;
    const key = it.movementKey;
    const koName = mv ? mv.ko : (it.raw.replace(/\([^)]*\)/g,'').trim());
    const el = document.createElement('div');
    el.className = 'mv';
    const canOpen = !!mv || !!key;

    const row = document.createElement('div');
    row.className = 'mv-row' + (canOpen ? '' : ' static');
    row.innerHTML = `
      <div>
        <div class="mv-ko">${esc(koName)}${mv ? '' : '<span class="badge-todo">설명 준비 중</span>'}</div>
        ${key && mv ? `<div class="mv-en">${esc(key)}</div>` : ''}
        ${it.note ? `<div class="mv-note">※ ${esc(it.note)}</div>` : ''}
      </div>
      ${it.reps ? `<div class="mv-reps">${esc(it.reps)}</div>` : ''}`;
    el.appendChild(row);

    if (canOpen) {
      const det = document.createElement('div');
      det.className = 'mv-detail';
      det.innerHTML = `
        ${mv && mv.desc ? `<div class="desc">${esc(mv.desc)}</div>` : ''}
        <a class="yt" target="_blank" rel="noopener" href="${ytLink(mv, key)}">▶ 시연 영상 보기</a>`;
      el.appendChild(det);
      row.addEventListener('click', () => el.classList.toggle('open'));
    }
    return el;
  }

  function renderSection(s) {
    const sec = document.createElement('div');
    sec.className = 'section';
    const emoji = SEC_EMOJI[s.name] || '•';
    let meta = '';
    const pills = [];
    (s.formats||[]).forEach(f => pills.push(f.ko));
    if (s.timeCap) pills.push(s.timeCap.ko);
    if (pills.length) meta = pills.map(p => `<span class="pill">${esc(p)}</span>`).join('');

    sec.innerHTML = `
      <div class="sec-title"><span class="emoji">${emoji}</span>${esc(s.nameKo)} <span class="mv-en">${esc(s.name)}</span></div>
      ${meta ? `<div class="sec-meta">${meta}</div>` : ''}
      ${s.scheme ? `<div class="scheme">${esc(s.scheme.replace(/-/g,' – '))}</div>` : ''}`;
    (s.items||[]).forEach(it => sec.appendChild(renderItem(it)));
    return sec;
  }

  function renderWod(w, forceOpen) {
    const wod = document.createElement('div');
    wod.className = 'wod' + (w.highlight ? ' hl' : '') + (forceOpen ? ' open' : '');
    const head = document.createElement('div');
    head.className = 'wod-head';
    const catName = w.category || w.name;
    // 펼친(하이라이트) 카드는 전체 시간표, 접힌 카드는 첫 시간 + 개수로 축약
    const times = w.times || [];
    let timesLabel = '';
    if (times.length) {
      timesLabel = forceOpen
        ? times.join(' · ')
        : (times.length > 1 ? `${times[0]} 외 ${times.length - 1}` : times[0]);
    }
    head.innerHTML = `
      <span class="cat">${esc(catName)}</span>
      <span class="times">${esc(timesLabel)}</span>
      <span class="chev">▶</span>`;
    wod.appendChild(head);

    const body = document.createElement('div');
    body.className = 'wod-body';
    (w.steps||[]).forEach(st => {
      (st.sections||[]).forEach(s => body.appendChild(renderSection(s)));
      // 원문 토글
      if (st.raw) {
        const t = document.createElement('span');
        t.className = 'raw-toggle'; t.textContent = '원문 보기';
        const pre = document.createElement('pre');
        pre.className = 'raw'; pre.textContent = st.raw;
        t.addEventListener('click', () => pre.classList.toggle('open'));
        body.appendChild(t); body.appendChild(pre);
      }
    });
    wod.appendChild(body);
    head.addEventListener('click', () => wod.classList.toggle('open'));
    return wod;
  }

  function render() {
    content.innerHTML = '';
    if (!data) {
      content.innerHTML = `<div class="empty"><div class="big">📡</div>
        데이터가 아직 없습니다.<br><span style="font-size:13px">수집기를 먼저 실행하세요: <code>node collector/collect.js</code></span></div>`;
      document.getElementById('footer').textContent = '';
      return;
    }
    const dateIso = curDay === 'today' ? data.today : data.tomorrow;
    document.getElementById('dateLabel').textContent = (curDay==='today'?'오늘 · ':'내일 · ') + fmtDate(dateIso);
    document.getElementById('boxLabel').textContent = data.box ? data.box.name : '';

    const wods = (data.days && data.days[dateIso]) || [];
    if (!wods.length) {
      content.innerHTML = `<div class="empty"><div class="big">🕒</div>
        ${curDay==='tomorrow' ? '내일 WOD가 아직 안 올라왔어요.<br><span style="font-size:13px">보통 오후에 갱신됩니다.</span>' : '오늘 WOD 데이터가 없습니다.'}</div>`;
    } else {
      // 하이라이트(DIET/SWEAT) 먼저 + 펼침, 나머지는 접힘
      wods.forEach(w => content.appendChild(renderWod(w, w.highlight)));
    }

    const gen = new Date(data.generatedAt);
    const hh = String(gen.getHours()).padStart(2,'0');
    const mm = String(gen.getMinutes()).padStart(2,'0');
    document.getElementById('footer').textContent = `마지막 갱신 ${gen.getMonth()+1}/${gen.getDate()} ${hh}:${mm}`;
  }

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      curDay = tab.dataset.day;
      render();
    });
  });

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  render();
})();
</script>
</body>
</html>
